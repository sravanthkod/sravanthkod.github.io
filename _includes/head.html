<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">

  <!-- Theme resolved before first paint so there's no flash of the wrong mode -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#0f172a' : '#f8fafc');
    })();
  </script>

  <title>{% if page.title %}Sravanth Kodavanti - {{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <!-- Open Graph meta tags for social sharing and search results -->
  <meta property="og:title" content="{% if page.title %}Sravanth Kodavanti - {{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{% if page.title %}Sravanth Kodavanti - {{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="twitter:image" content="{% if page.image %}{{ page.image | prepend: site.url }}{% else %}{{ site.url }}/assets/sravanth_profile_3.jpeg{% endif %}" />
  <meta property="og:image" content="{% if page.image %}{{ page.image | prepend: site.url }}{% else %}{{ site.url }}/assets/sravanth_profile_3.jpeg{% endif %}" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}">

  <!-- Schema.org structured data for rich snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Sravanth Kodavanti",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/assets/sravanth_profile_3.jpeg",
    "jobTitle": "Research Engineer",
    "worksFor": {
      "@type": "Organization",
      "name": "Samsung Research"
    },
    "description": "Research Engineer at Samsung Research working on AI model optimization, Neural Architecture Search, Quantization, and Pruning for edge device deployment.",
    "sameAs": [
      "https://www.linkedin.com/in/sravanthk27/",
      "https://github.com/sravanthkod",
      "https://twitter.com/sravanthkod",
      "https://scholar.google.com/citations?user=SiOQawIAAAAJ&hl=en"
    ],
    "email": "ramasravanthkodavanti@gmail.com"
  }
  </script>
</head>

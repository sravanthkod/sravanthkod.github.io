name: Sync Binge from Letterboxd

on:
  schedule:
    - cron: "23 18 * * 1" # Mondays 18:23 UTC — off the hour to be kind
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-binge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync
        run: python3 scripts/fetch_letterboxd.py

      - name: Commit new films if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/letterboxd.json assets/binge/posters
          if git diff --cached --quiet; then
            echo "No new films; nothing to commit."
            exit 0
          fi
          git commit -m "Sync Binge films from Letterboxd

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push

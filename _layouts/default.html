<!DOCTYPE html>
<html lang="en">

  <head>
    {% include head.html %}
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
    {% include mathjax.html %}
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    {% include visitors-beacon.html %}
    <main class="main-content" id="main">
      {{ content }}
    </main>
    {% include footer.html %}

    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        var meta = document.querySelector('meta[name="theme-color"]');
        var chromeColor = { light: '#ffffff', dark: '#0d1117' };

        function apply(theme, persist) {
          document.documentElement.setAttribute('data-theme', theme);
          if (meta) meta.setAttribute('content', chromeColor[theme]);
          if (btn) {
            var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
            btn.setAttribute('aria-label', label);
            btn.title = label;
          }
          if (persist) {
            try { localStorage.setItem('theme', theme); } catch (e) {}
          }
          document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));
        }

        if (btn) {
          btn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            apply(next, true);
          });
        }

        // Follow OS-level changes only while the visitor hasn't picked explicitly
        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var onSystemChange = function (e) {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (err) {}
            if (stored) return;
            apply(e.matches ? 'dark' : 'light', false);
          };
          if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
          else if (mq.addListener) mq.addListener(onSystemChange);
        }

        apply(document.documentElement.getAttribute('data-theme') || 'light', false);
      })();

      // Mobile menu + header shadow once the page scrolls
      (function () {
        var header = document.getElementById('site-header');
        var toggle = document.getElementById('nav-toggle');
        if (toggle && header) {
          var setOpen = function (open) {
            header.classList.toggle('nav-open', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
          };
          toggle.addEventListener('click', function () {
            setOpen(!header.classList.contains('nav-open'));
          });
          document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && header.classList.contains('nav-open')) { setOpen(false); toggle.focus(); }
          });
          window.addEventListener('resize', function () {
            if (window.innerWidth > 860) setOpen(false);
          });
        }
        if (header) {
          var onScroll = function () { header.classList.toggle('scrolled', window.scrollY > 4); };
          window.addEventListener('scroll', onScroll, { passive: true });
          onScroll();
        }
      })();
    </script>
  </body>

</html>
